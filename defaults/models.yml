# Model endpoint configuration for VoidRift CLI (REQ-MC-1, REQ-MC-3)
#
# Local models are auto-discovered from worker-models.yml — no entry needed here.
# Add an explicit entry only to override a worker model's endpoint or model_id.
#
# Endpoint types:
#   cloud   — Provider APIs (Anthropic, Google)
#   gateway — Kiro Gateway (managed by worker-cli)
#
# Optional fields:
#   max_context — context window size (integer). Used when the model's API does
#                 not expose max_model_len. Required for cloud and gateway models;
#                 not needed for local (vLLM exposes max_model_len via its API).
#
# Variable expansion:
#   ${section.key}  — Reference from config.yml (e.g., ${worker.ip})
#   ${VAR}          — Environment variable
#   ${VAR:-default} — Environment variable with default

models:
  # Cloud models
  claude:
    model_id: "anthropic/claude-opus-4-6"
    type: cloud
    provider: anthropic
    max_context: 200000

  haiku:
    model_id: "anthropic/claude-haiku-4.5-20251001"
    type: cloud
    provider: anthropic
    max_context: 200000

  gemini:
    model_id: "gemini/gemini-2.5-pro"
    type: cloud
    provider: gemini
    max_context: 1048576

  gemini-flash:
    model_id: "gemini/gemini-2.5-flash"
    type: cloud
    provider: gemini
    max_context: 1048576

  # Kiro Gateway models (start with: worker kiro start)
  kiro:
    model_id: "openai/auto"
    base_url: "http://localhost:${kiro.port}/v1"
    api_key: "${kiro.api_key}"
    type: gateway

  kiro-opus:
    model_id: "openai/claude-opus-4.6"
    base_url: "http://localhost:${kiro.port}/v1"
    api_key: "${kiro.api_key}"
    type: gateway
    max_context: 1048576

  kiro-sonnet:
    model_id: "openai/claude-sonnet-4.6"
    base_url: "http://localhost:${kiro.port}/v1"
    api_key: "${kiro.api_key}"
    type: gateway
    max_context: 1048576

  kiro-opus-4.5:
    model_id: "openai/claude-opus-4.5"
    base_url: "http://localhost:${kiro.port}/v1"
    api_key: "${kiro.api_key}"
    type: gateway
    max_context: 200000

  kiro-sonnet-4.5:
    model_id: "openai/claude-sonnet-4.5"
    base_url: "http://localhost:${kiro.port}/v1"
