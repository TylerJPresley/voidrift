# VoidRift Framework Configuration
# Source of truth: ~/Projects/voidrift/config.yml
# Runtime location: ~/.voidrift/config.yml (synced via make sync)

models_file: ~/.worker-cli/models.yml
active_container_file: ~/.worker-cli/.active-container

api_keys:
  anthropic: ${ANTHROPIC_API_KEY}
  gemini: ${GEMINI_API_KEY}

retention:
  project: 5
  global: 30

# Paths that file tools are blocked from reading or writing in addition to
# path sandboxing. Supports glob patterns. Relative to project root.
protected_paths:
  - .env
  - .secrets
  - "**/*.pem"
  - "**/*.key"

# Hostnames or CIDR blocks that the SSRF guard permits for http_client
# and web_fetch tools. Use when your project needs to reach internal services.
# Examples: "internal.corp.example.com", "10.0.0.0/8"
ssrf_allow_list: []

# Skills system configuration.
skills:
  # Model alias to use for skill synthesis (voidrift skills install --synthesize).
  # Leave empty to disable synthesis and fall back to direct copy.
  synthesis_model: ""
  # External skill repositories. Each entry is a raw-content URL to a
  # skills-manifest.yml file (e.g. GitHub raw content URL).
  repos: []

# Analysis cache settings (voidrift prune controls manual cleanup).
cache:
  max_entries: 500
  ttl_days: 30

stage_max_tokens:
  # Gather
  gather.triage: 8192
  gather.analysis: 8192
  gather.consolidation: 32768
  # Plan
  plan.delta: 8192
  plan.architecture: 32768
  plan.module-arch: 32768
  plan.outline: 8192
  plan.deps: 8192
  plan.task: 16384
  plan.readme: 32768
  # Develop
  develop.task: 16384
  develop.escalation: 16384
  # Verify
  verify.plan: 32768
  verify.execute: 8192
  # Chat
  chat.session: 16384
  chat.quick: 2048
  # Deploy
  deploy.version: 4096
  deploy.iac: 8192

bash:
  timeout: 120
  max_output_lines: 500
  develop:
    enabled: true
    allowed_patterns:
      - "make *"
      - "pytest *"
      - "cargo *"
      - "npm *"
      - "ruff *"
      - "mypy *"
      - "pyright *"
    timeout: 60
  chat:
    enabled: true
    allowed_patterns: []
    timeout: 120
  verify:
    enabled: true
    allowed_patterns: []
    timeout: 120
