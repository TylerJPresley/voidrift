[project]
name = "voidrift-mcp-context-server"
dynamic = ["version"]
description = "MCP Context Server for VoidRift framework — stores, retrieves, and exports project artifacts and framework resources"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.1.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/voidrift_mcp"]

[project.scripts]
voidrift-mcp = "voidrift_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
